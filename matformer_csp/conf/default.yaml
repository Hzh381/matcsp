expname: test

# 数据集根目录：可用 MATFORMER_CSP_DATA_ROOT 指向 CrystalFlow/data 或其他数据目录
data_root: ${oc.env:MATFORMER_CSP_DATA_ROOT,${oc.env:PROJECT_ROOT}/data}

# metadata specialised for each experiment
core:
  version: 0.0.1
  tags:
    - ${now:%Y-%m-%d}

hydra:
  run:
    dir: outputs/${expname}/${now:%Y-%m-%d_%H-%M-%S}

  sweep:
    dir: outputs/multirun/${expname}/
    subdir: ${hydra.job.num}_${hydra.job.id}

  job:
    chdir: false
    env_set:
      WANDB_START_METHOD: thread

defaults:
  - data: default
  - logging: default
  - model: diffusion
  - optim: default
  - train: default
  - gmm: default
  - override hydra/job_logging: custom
  - _self_
#    Decomment this parameter to get parallel job running
  # - override hydra/launcher: joblib
