# GMM 耦合流匹配（DNG 版本，同时生成原子类型）
_target_: matformer_csp.pl_modules.flow_gmm_w_type.CSPFlowGMMType
time_dim: 256
latent_dim: 0
cost_type: 10.
cost_coord: 10.
cost_lattice: 1.
max_neighbors: 20
radius: 7.
timesteps: 1000
lattice_polar: true
lattice_polar_sigma: 0.1
gmm_prior_path: null

defaults:
  - decoder: cspnet
  - beta_scheduler: cosine
  - sigma_scheduler: wrapped
  - conditions: default
  - _self_

decoder:
  pred_type: true
  smooth: true
  lattice_dim: 6
  ip: false
